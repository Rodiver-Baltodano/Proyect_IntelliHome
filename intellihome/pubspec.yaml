name: intellihome
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  local_auth: ^2.1.7
  mqtt_client: ^10.2.0
  uuid: ^4.0.0
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_colorpicker: ^1.1.0
  path_provider: ^2.1.1
  image_picker: ^1.0.0
  path: ^1.8.0
  flutter_dotenv: ^5.1.0
  mailer: ^6.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/icons/
    - .env
    - lib/assets/data/amenidades.json
    